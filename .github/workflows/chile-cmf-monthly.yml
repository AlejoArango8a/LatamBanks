# El archivo se sigue llamando "monthly" para no perder el historial de
# corridas, que va atado a la ruta del archivo.
name: Chile CMF Balance Bancos (chequeo diario)

on:
  schedule:
    # La CMF publica el mes anterior con un rezago de entre tres y cuatro
    # semanas, en un día que no se puede anticipar. Cualquier agenda de turnos
    # fijos deja el mes nuevo esperando hasta el siguiente turno: agosto se
    # publicó entre el 25 y el 30 de septiembre y quedó fuera de la plataforma.
    #
    # Se revisa entonces todos los días. Cuando no hay mes nuevo el balance
    # cuesta dos páginas HTML y una lectura de carga_log, que tiene un centenar
    # de filas; los pasos caros siguen atados al día 2 y al último del mes.
    # Discovery: listing 32901 (ZIP) + hub 28910 (cluster).
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | article | zip-url | range'
        required: false
        default: 'incremental'
      article_id:
        description: 'CMF articles-{ID} (mode=article)'
        required: false
        default: ''
      zip_url:
        description: 'URL directa al ZIP (mode=zip-url)'
        required: false
        default: ''
      from:
        description: 'YYYYMM start (mode=range) e.g. 201801'
        required: false
        default: ''
      to:
        description: 'YYYYMM end (mode=range) e.g. 202112'
        required: false
        default: ''
      force:
        description: 'Overwrite if period already loaded (true/false)'
        required: false
        default: 'false'

jobs:
  # El balance se revisa todos los días. Los otros tres loaders son caros —
  # Basilea recorre las filas chilenas para saber qué meses tiene e
  # institutional funding reescribe unas 900 filas por corrida — así que solo
  # corren en la corrida completa: el día 2, el último del mes, o cualquier día
  # en que el balance haya traído un mes nuevo.
  cadencia:
    runs-on: ubuntu-latest
    outputs:
      completa: ${{ steps.check.outputs.completa }}
    steps:
      - id: check
        env:
          TZ: UTC
          EVENTO: ${{ github.event_name }}
          MODO: ${{ github.event.inputs.mode }}
        run: |
          dia=$(date -u +%-d)
          manana=$(date -u -d '+1 day' +%-d)
          if [ "$EVENTO" != 'schedule' ]; then
            # Los disparos manuales de article/zip-url/range cargan un mes
            # puntual y no tocan los otros loaders, como hasta ahora.
            if [ -z "$MODO" ] || [ "$MODO" = 'incremental' ]; then
              echo "completa=true" >> "$GITHUB_OUTPUT"
              echo "Disparo manual en modo incremental — corrida completa."
            else
              echo "completa=false" >> "$GITHUB_OUTPUT"
              echo "Disparo manual en modo $MODO — solo el balance."
            fi
          elif [ "$dia" -eq 2 ] || [ "$manana" -eq 1 ]; then
            echo "completa=true" >> "$GITHUB_OUTPUT"
            echo "$(date -u +%F) es día 2 o último del mes — corrida completa."
          else
            echo "completa=false" >> "$GITHUB_OUTPUT"
            echo "$(date -u +%F) — solo se revisa si la CMF publicó un mes nuevo."
          fi

  load:
    needs: cadencia
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load Chile CMF
        id: balance
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ "$MODE" = "article" ]; then
            python chile_loader.py --article-id "${{ github.event.inputs.article_id }}" $FORCE_FLAG 2>&1 | tee "$RUNNER_TEMP/salida.log"
          elif [ "$MODE" = "zip-url" ]; then
            python chile_loader.py --zip-url "${{ github.event.inputs.zip_url }}" $FORCE_FLAG 2>&1 | tee "$RUNNER_TEMP/salida.log"
          elif [ "$MODE" = "range" ]; then
            python chile_loader.py --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}" $FORCE_FLAG 2>&1 | tee "$RUNNER_TEMP/salida.log"
          else
            python chile_loader.py $FORCE_FLAG 2>&1 | tee "$RUNNER_TEMP/salida.log"
          fi
          # El loader cierra con "periods loaded this run: N". Sirve para que
          # los loaders caros corran el mismo día en que llega un mes nuevo,
          # sin esperar al turno siguiente.
          nuevos=$(sed -n 's/.*periods loaded this run: \([0-9][0-9]*\).*/\1/p' "$RUNNER_TEMP/salida.log" | tail -1)
          echo "nuevos=${nuevos:-0}" >> "$GITHUB_OUTPUT"
          echo "Meses nuevos en esta corrida: ${nuevos:-0}"

      - name: Load Chile Basilea III (CMF xlsx)
        if: ${{ needs.cadencia.outputs.completa == 'true' || steps.balance.outputs.nuevos != '0' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          # Redundant with chile_loader incremental hook; keeps Basilea loadable
          # even when ZIP step is skipped via workflow_dispatch modes.
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python chile_basilea_loader.py $FORCE_FLAG

      - name: Load Institutional Funding (FM DAP / BB)
        if: ${{ needs.cadencia.outputs.completa == 'true' || steps.balance.outputs.nuevos != '0' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # Prior month typically; loader defaults to month-2 lag if unset.
          python chile_institutional_funding_loader.py --refresh-registry $FORCE_FLAG

      - name: Refresh Chile macros (UF/USD/IPC)
        if: ${{ needs.cadencia.outputs.completa == 'true' || steps.balance.outputs.nuevos != '0' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
          CMF_API_KEY: ${{ secrets.CMF_API_KEY }}
        run: python chile_macros_loader.py

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-loader-failure
        with:
          country: Chile CMF
