# El archivo se sigue llamando "monthly" para no perder el historial de
# corridas, que va atado a la ruta del archivo.
name: Chile CMF Balance Bancos (2 veces al mes)

on:
  schedule:
    # Dos veces al mes: el día 2 y el último día del mes. La CMF publica el mes
    # anterior con un rezago de entre tres y cuatro semanas, y con una sola
    # corrida mensual lo que se publicaba justo después del turno se quedaba
    # esperando hasta cuatro semanas.
    #
    # cron no sabe de "último día del mes", así que se programa del 28 al 31 y
    # el job `gate` descarta los días de esa ventana que no son el último.
    # Discovery: listing 32901 (ZIP) + hub 28910 (cluster).
    - cron: '0 14 2 * *'
    - cron: '0 14 28-31 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | article | zip-url | range'
        required: false
        default: 'incremental'
      article_id:
        description: 'CMF articles-{ID} (mode=article)'
        required: false
        default: ''
      zip_url:
        description: 'URL directa al ZIP (mode=zip-url)'
        required: false
        default: ''
      from:
        description: 'YYYYMM start (mode=range) e.g. 201801'
        required: false
        default: ''
      to:
        description: 'YYYYMM end (mode=range) e.g. 202112'
        required: false
        default: ''
      force:
        description: 'Overwrite if period already loaded (true/false)'
        required: false
        default: 'false'

jobs:
  # Filtra solo la ventana del 28 al 31: de esos cuatro disparos, el único que
  # interesa es el último día del mes. Cualquier otro día pasa sin preguntar,
  # para que un retraso de GitHub que corra el día 2 pasada la medianoche no
  # termine saltándose la corrida.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          TZ: UTC
          EVENTO: ${{ github.event_name }}
        run: |
          dia=$(date -u +%-d)
          manana=$(date -u -d '+1 day' +%-d)
          if [ "$EVENTO" != 'schedule' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Disparo manual — se corre sin mirar la fecha."
          elif [ "$dia" -ge 28 ] && [ "$manana" -ne 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "$(date -u +%F) no es el último día del mes — se omite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "$(date -u +%F) — corresponde correr."
          fi

  load:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load Chile CMF
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          if [ "$MODE" = "article" ]; then
            python chile_loader.py --article-id "${{ github.event.inputs.article_id }}" $FORCE_FLAG
          elif [ "$MODE" = "zip-url" ]; then
            python chile_loader.py --zip-url "${{ github.event.inputs.zip_url }}" $FORCE_FLAG
          elif [ "$MODE" = "range" ]; then
            python chile_loader.py --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}" $FORCE_FLAG
          else
            python chile_loader.py $FORCE_FLAG
          fi

      - name: Load Chile Basilea III (CMF xlsx)
        if: ${{ github.event.inputs.mode == 'incremental' || github.event.inputs.mode == '' || github.event_name == 'schedule' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          # Redundant with chile_loader incremental hook; keeps Basilea loadable
          # even when ZIP step is skipped via workflow_dispatch modes.
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python chile_basilea_loader.py $FORCE_FLAG

      - name: Load Institutional Funding (FM DAP / BB)
        if: ${{ github.event.inputs.mode == 'incremental' || github.event.inputs.mode == '' || github.event_name == 'schedule' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # Prior month typically; loader defaults to month-2 lag if unset.
          python chile_institutional_funding_loader.py --refresh-registry $FORCE_FLAG

      - name: Refresh Chile macros (UF/USD/IPC)
        if: ${{ github.event.inputs.mode == 'incremental' || github.event.inputs.mode == '' || github.event_name == 'schedule' }}
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
          CMF_API_KEY: ${{ secrets.CMF_API_KEY }}
        run: python chile_macros_loader.py

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-loader-failure
        with:
          country: Chile CMF
