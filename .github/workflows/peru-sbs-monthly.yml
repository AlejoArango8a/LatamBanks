name: Peru SBS B-2201 (monthly)

on:
  schedule:
    # Día 20 de cada mes, 15:00 UTC — SBS publica con rezago de ~2–4 semanas
    - cron: '0 15 20 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | month | range'
        required: false
        default: 'incremental'
      month:
        description: 'AAAAMM (solo mode=month)'
        required: false
        default: ''
      from:
        description: 'AAAAMM inicio (mode=range)'
        required: false
        default: ''
      to:
        description: 'AAAAMM fin (mode=range)'
        required: false
        default: ''

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load Peru SBS B-2201
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          if [ "$MODE" = "month" ]; then
            python peru_loader.py --month "${{ github.event.inputs.month }}"
          elif [ "$MODE" = "range" ]; then
            python peru_loader.py --all --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}"
          else
            python peru_loader.py
          fi
