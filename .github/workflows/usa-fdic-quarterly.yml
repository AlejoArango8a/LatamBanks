name: USA FDIC top-300 (quarterly)

on:
  schedule:
    # Mensual, aunque el dato sea trimestral. Antes corría solo el 25 de enero,
    # abril, julio y octubre, asumiendo que la FDIC publica los Call Reports el
    # mes siguiente al cierre; en la práctica tarda entre 55 y 60 días, así que
    # la ventana no coincidía. Al crearse este workflow el 2 de agosto de 2026
    # ya se había pasado el 25 de julio, y el siguiente turno era el 25 de
    # octubre: el segundo trimestre de 2026 se saltaba entero.
    # El modo incremental revisa los últimos cuatro trimestres y no escribe nada
    # cuando no hay novedad, así que correrlo todos los meses no cuesta y toma
    # cada trimestre dentro del mes siguiente a su publicación.
    - cron: '0 16 25 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | quarter | range'
        required: false
        default: 'incremental'
      quarter:
        description: 'AAAAMM (03/06/09/12) — mode=quarter'
        required: false
        default: ''
      from:
        description: 'AAAAMM inicio (mode=range)'
        required: false
        default: ''
      to:
        description: 'AAAAMM fin (mode=range)'
        required: false
        default: ''
      top:
        description: 'Bancos por equity (default 300)'
        required: false
        default: '300'

jobs:
  load:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load USA FDIC top-N
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          TOP="${{ github.event.inputs.top || '300' }}"
          if [ "$MODE" = "quarter" ]; then
            python usa_loader.py --quarter "${{ github.event.inputs.quarter }}" --top "$TOP"
          elif [ "$MODE" = "range" ]; then
            python usa_loader.py --all --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}" --top "$TOP"
          else
            python usa_loader.py --top "$TOP"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-loader-failure
        with:
          country: United States FDIC
