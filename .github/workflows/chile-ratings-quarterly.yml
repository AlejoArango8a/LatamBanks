name: Chile bank ratings (Humphreys refresh)

on:
  schedule:
    # Quarterly — 1st of Jan/Apr/Jul/Oct
    - cron: '0 15 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scrape Humphreys + merge curated seed
        run: python chile_ratings_loader.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/cl_bank_ratings.json; then
            echo "No ratings changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cl_bank_ratings.json
          git commit -m "chore(CL): refresh bank ratings from Humphreys"
          git push
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-loader-failure
        with:
          country: Chile ratings
