name: Mexico CNBV Banca Múltiple (monthly)

on:
  schedule:
    # Día 22 de cada mes (boletín del mes anterior suele estar publicado)
    - cron: '0 16 22 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'incremental | month | range'
        required: false
        default: 'incremental'
      month:
        description: 'AAAAMM — mode=month'
        required: false
        default: ''
      from:
        description: 'AAAAMM inicio (mode=range)'
        required: false
        default: ''
      to:
        description: 'AAAAMM fin (mode=range)'
        required: false
        default: ''

jobs:
  load:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Load Mexico CNBV BM
        env:
          COCKROACH_URL: ${{ secrets.COCKROACH_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'incremental' }}"
          if [ "$MODE" = "month" ]; then
            python mexico_loader.py --month "${{ github.event.inputs.month }}"
          elif [ "$MODE" = "range" ]; then
            python mexico_loader.py --all --from "${{ github.event.inputs.from }}" --to "${{ github.event.inputs.to }}"
          else
            python mexico_loader.py
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-loader-failure
        with:
          country: Mexico CNBV
